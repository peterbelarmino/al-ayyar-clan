<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al-Ayyar Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6e9;--paper:#fff;--gold:#c9a86b;--emerald:#0a5c48;--burgundy:#8b1e3f;--ink:#1c1a16;--line:#e8d9b5}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink)}
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:999}
.box{background:var(--paper);padding:44px 32px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.12);width:92%;max-width:360px;text-align:center;border:1px solid var(--line)}
.crest{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--emerald),var(--gold));display:grid;place-items:center;color:#fff;font-size:32px;font-family:'Cormorant Garamond',serif}
h2{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--emerald)}p.sub{color:#8b7355;font-size:14px;margin:6px 0 22px}
input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font-size:16px;text-align:center}
button.primary{width:100%;margin-top:12px;padding:14px;background:var(--emerald);color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer}
#main{display:none}#main.show{display:block}
.hero{text-align:center;padding:90px 20px 60px}
.arabic{font-family:'Cormorant Garamond',serif;font-size:36px;color:var(--emerald)}.title{font-family:'Cormorant Garamond',serif;font-size:clamp(48px,10vw,84px);color:var(--burgundy);line-height:.9}
.rule{width:140px;height:3px;margin:24px auto;background:linear-gradient(90deg,transparent,var(--gold),var(--emerald),transparent)}
.grid{max-width:1100px;margin:40px auto;padding:0 20px;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{position:relative;border-radius:16px;overflow:hidden;background:var(--paper);box-shadow:0 8px 24px rgba(0,0,0,.08);cursor:pointer;transition:.3s;border:1px solid var(--line)}
.card:hover{transform:translateY(-4px)}.card img{width:100%;height:260px;object-fit:cover;display:block}
.info{position:absolute;bottom:0;left:0;right:0;padding:18px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.info h3{font-family:'Cormorant Garamond',serif;font-size:22px}.info p{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.badge{position:absolute;top:12px;right:12px;background:#fff;color:var(--emerald);padding:5px 10px;border-radius:12px;font-size:11px;font-weight:600}
footer{text-align:center;padding:50px 20px 30px;color:#8b7355;font-size:13px;border-top:1px solid var(--line);margin-top:60px}
#gallery{position:fixed;inset:0;background:var(--bg);z-index:1000;display:none;overflow:auto}#gallery.show{display:block}
.ghead{position:sticky;top:0;background:rgba(253,246,233,.9);backdrop-filter:blur(8px);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.gtitle{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--emerald)}.actions{display:flex;gap:8px}
.btn{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;cursor:pointer}.btn.primary{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.tabs{display:flex;gap:8px;padding:12px 18px;overflow:auto;border-bottom:1px solid var(--line);background:#fff8e8}
.tab{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--ink);color:#fff}
.wrap{max-width:1300px;margin:auto;padding:22px 18px}
.shead{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid rgba(201,168,107,.3)}
.shead h4{font-family:'Cormorant Garamond',serif;color:var(--emerald);font-size:20px}.count{background:var(--gold);color:#fff;padding:3px 9px;border-radius:10px;font-size:11px}
.masonry{columns:2 160px;column-gap:14px}@media(min-width:800px){.masonry{columns:3 200px}}
.tile{break-inside:avoid;margin-bottom:14px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.07);cursor:pointer;border:1px solid var(--line)}
.tile img,.tile video{width:100%;display:block}
.empty{padding:40px;text-align:center;color:#9a8a6f;background:#fff;border:1px dashed var(--line);border-radius:12px}
#light{position:fixed;inset:0;background:#000;display:none;place-items:center;z-index:2000}#light.show{display:grid}
.media{max-width:95vw;max-height:90vh}.x{position:absolute;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer}
</style>
</head>
<body>
<div id="gate"><div class="box"><div class="crest">ع</div><h2>Al-Ayyar Archive</h2><p class="sub">Private • Est. 1985</p><input id="pw" type="password" placeholder="Password"><button class="primary" onclick="go()">Enter</button></div></div>

<div id="main">
  <div class="hero"><div class="arabic">عائلة العيار</div><h1 class="title">AL-AYYAR</h1><div class="rule"></div><p style="max-width:560px;margin:18px auto 0;color:#5a5246">Four decades preserved. From birth to parenthood.</p></div>
  <div class="grid">
    <div class="card" onclick="openG('parents')"><img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800"><div class="badge">1985</div><div class="info"><h3>Faisal & Amal</h3><p>Parents</p></div></div>
    <div class="card" onclick="openG('baida')"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=800"><div class="badge">Eldest</div><div class="info"><h3>Baida</h3><p>Daughter</p></div></div>
    <div class="card" onclick="openG('mubarak')"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800"><div class="badge">Second</div><div class="info"><h3>Mubarak</h3><p>Son</p></div></div>
    <div class="card" onclick="openG('hamdi')"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800"><div class="badge">Youngest</div><div class="info"><h3>Hamdi</h3><p>Youngest</p></div></div>
  </div>
  <footer><div style="font-family:'Cormorant Garamond',serif;color:var(--emerald);font-size:17px;margin-bottom:4px">عائلة العيار</div>© 2026 Al-Ayyar Family Archive • Private Collection • Est. 1985</footer>
</div>

<div id="gallery"><div class="ghead"><div class="gtitle" id="gt"></div><div class="actions"><button class="btn primary" id="up">Upload</button><button class="btn" onclick="closeG()">Close</button></div></div><div class="tabs" id="tabs"></div><div class="wrap" id="wrap"></div></div>
<div id="light" onclick="closeL()"><span class="x">×</span><img id="li" class="media" style="display:none"><video id="lv" class="media" controls style="display:none"></video></div>

<script>
const PASS='Ayyar2026!', REPO='peterbelarmino/al-ayyar-clan';
const DATA={
 parents:{t:'Faisal & Amal',f:[['Early','parents-photos/early'],['Children','parents-photos/children']]},
 baida:{t:'Baida',f:[['Born','baida-photos/born'],['Teen','baida-photos/teen'],['Wedding','baida-photos/wedding'],['Motherhood','baida-photos/motherhood']]},
 mubarak:{t:'Mubarak',f:[['Born','mubarak-photos/born'],['Teen','mubarak-photos/teen']]},
 hamdi:{t:'Hamdi',f:[['Childhood','hamdi-photos/childhood']]}
};
let cur='';
function go(){if(pw.value===PASS){gate.style.display='none';main.classList.add('show');localStorage.ok=1}}
if(localStorage.ok){gate.style.display='none';main.classList.add('show')}
function openG(k){const d=DATA[k];gallery.classList.add('show');gt.textContent=d.t;tabs.innerHTML='';d.f.forEach(([n,p],i)=>{const b=document.createElement('button');b.className='tab'+(i?'':' active');b.textContent=n;b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');load(p)};tabs.appendChild(b)});load(d.f[0][1])}
function closeG(){gallery.classList.remove('show')}
async function load(folder){cur=folder;wrap.innerHTML=`<div class="shead"><h4>Photos</h4><span class="count" id="pc">0</span></div><div class="masonry" id="pm"></div><div class="shead" style="margin-top:28px"><h4>Videos</h4><span class="count" id="vc">0</span></div><div class="masonry" id="vm"></div>`;try{const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${folder}`);if(!r.ok)throw new Error('Folder not found');const files=await r.json();const p=files.filter(f=>/\.(jpg|jpeg|png|webp)$/i.test(f.name));const v=files.filter(f=>/\.(mp4|mov|webm)$/i.test(f.name));pc.textContent=p.length;vc.textContent=v.length;pm.innerHTML=p.length?p.map(f=>`<div class="tile" onclick="show('img','${f.download_url}')"><img src="${f.download_url}" loading="lazy"></div>`).join(''):'<div class="empty">No photos yet.<br>Click Upload to add.</div>';vm.innerHTML=v.length?v.map(f=>`<div class="tile" onclick="show('vid','${f.download_url}')"><video src="${f.download_url}" muted preload="metadata"></video></div>`).join(''):'<div class="empty">No videos yet.</div>'}catch(e){wrap.innerHTML=`<div class="empty"><b>Folder not found:</b> ${folder}<br><br>1. Go to GitHub<br>2. Create folder<br>3. Upload photos<br><br><a href="https://github.com/${REPO}/new/main" target="_blank" style="color:var(--emerald);font-weight:600">Create now →</a></div>`}}
function show(t,s){light.classList.add('show');if(t==='img'){li.style.display='block';lv.style.display='none';li.src=s}else{lv.style.display='block';li.style.display='none';lv.src=s;lv.play()}}
function closeL(){light.classList.remove('show');lv.pause()}
up.onclick=()=>window.open(`https://github.com/${REPO}/upload/main/${cur}`,'_blank')
</script>
</body>
</html>
