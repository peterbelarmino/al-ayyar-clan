<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al-Ayyar Family Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fefcf8;--gold:#b8860b;--border:#e8e2d5;--text:#1a1a1a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.gate-box{background:#fff;padding:50px 40px;border:1px solid var(--border);text-align:center;width:90%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.gate-box h2{font-family:'Cormorant Garamond',serif;font-size:2.2rem;color:var(--gold);margin-bottom:8px}
.gate-box p{color:#666;margin-bottom:25px}
.gate-box input{width:100%;padding:14px;border:1px solid var(--border);text-align:center;font-size:16px;margin-bottom:15px}
.gate-box button{width:100%;padding:14px;background:var(--gold);color:#fff;border:none;font-size:16px;cursor:pointer}
.error{color:#c00;font-size:14px;display:none;margin-top:10px}
#main{display:none}
.container{max-width:1100px;margin:0 auto;padding:70px 20px;text-align:center}
.arabic{font-family:'Cormorant Garamond',serif;font-size:2.2rem;color:var(--gold);margin-bottom:5px;letter-spacing:3px}
.main-title{font-family:'Cormorant Garamond',serif;font-size:3.8rem;margin:0;color:var(--text);font-weight:700;letter-spacing:1px}
.gold-line{width:80px;height:2px;background:var(--gold);margin:20px auto}
.subtitle{font-size:16px;color:#666;margin:0;letter-spacing:0.5px}
.tagline{font-size:14px;color:#999;margin-top:8px;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:25px;margin-top:60px}
.card{background:#fff;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 20px rgba(0,0,0,.06);border-color:var(--gold)}
.card img{width:100%;height:200px;object-fit:cover;display:block;background:#f5f5f5}
.card-info{padding:20px}
.card-info h3{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--gold);margin-bottom:5px}
#gallery{position:fixed;inset:0;background:var(--bg);z-index:10000;display:none;overflow-y:auto}
.gal-head{position:sticky;top:0;background:var(--bg);padding:20px 30px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.gal-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem}
.close-btn{background:var(--gold);color:#fff;border:none;padding:10px 20px;cursor:pointer}
.gal-grid{padding:30px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.gal-grid img,.gal-grid video{width:100%;height:250px;object-fit:cover;border:1px solid var(--border);background:#000}
footer{margin-top:70px;padding-top:25px;border-top:1px solid var(--border);color:#999;font-size:13px}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h2>Al-Ayyar Archive</h2>
    <p>Private Family Collection</p>
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="checkPassword()">Enter Archive</button>
    <div class="error" id="errorMsg">Incorrect password</div>
  </div>
</div>

<div id="main">
  <div class="container">
    <!-- NEW ENHANCED HEADER -->
    <div class="arabic">عائلة العيار</div>
    <h1 class="main-title">AL-AYYAR FAMILY</h1>
    <div class="gold-line"></div>
    <p class="subtitle">Established by Faisal & Amal • Kuwait, 1985</p>
    <p class="tagline">Preserving Four Decades of Memories</p>

    <div class="grid">
      <div class="card" onclick="openGallery('parents')">
        <img src="parents-photos/1.jpg" onerror="this.src='https://via.placeholder.com/400x300?text=Parents'">
        <div class="card-info"><h3>Faisal & Amal</h3><p>Parents</p></div>
      </div>
      <div class="card" onclick="openGallery('baida')">
        <img src="baida-photos/1.jpg" onerror="this.src='https://via.placeholder.com/400x300?text=Baida'">
        <div class="card-info"><h3>Baida</h3><p>Daughter</p></div>
      </div>
      <div class="card" onclick="openGallery('mubarak')">
        <img src="mubarak-photos/1.jpg" onerror="this.src='https://via.placeholder.com/400x300?text=Mubarak'">
        <div class="card-info"><h3>Mubarak</h3><p>Son</p></div>
      </div>
      <div class="card" onclick="openGallery('hamdi')">
        <img src="hamdi-photos/1.jpg" onerror="this.src='https://via.placeholder.com/400x300?text=Hamdi'">
        <div class="card-info"><h3>Hamdi</h3><p>Son</p></div>
      </div>
    </div>

    <footer>Private Archive • For Family Only</footer>
  </div>
</div>

<div id="gallery">
  <div class="gal-head">
    <div class="gal-title" id="galleryTitle"></div>
    <button class="close-btn" onclick="closeGallery()">Close ✕</button>
  </div>
  <div class="gal-grid" id="galleryGrid"></div>
</div>

<script>
const CORRECT_PASSWORD='Ayyar2026!';
function checkPassword(){
  const input=document.getElementById('password');
  if(input.value===CORRECT_PASSWORD){
    document.getElementById('gate').style.display='none';
    document.getElementById('main').style.display='block';
    localStorage.setItem('alAyyarAuth','true');
  }else{
    document.getElementById('errorMsg').style.display='block';
    input.value='';
  }
}
if(localStorage.getItem('alAyyarAuth')==='true'){
  document.getElementById('gate').style.display='none';
  document.getElementById('main').style.display='block';
}
document.getElementById('password').addEventListener('keypress',e=>{if(e.key==='Enter')checkPassword()});

const galleries={
  parents:{title:'Faisal & Amal',folder:'parents-photos',max:100},
  baida:{title:'Baida',folder:'baida-photos',max:100},
  mubarak:{title:'Mubarak',folder:'mubarak-photos',max:100},
  hamdi:{title:'Hamdi',folder:'hamdi-photos',max:100}
};

function openGallery(key){
  const g=galleries[key];
  document.getElementById('galleryTitle').textContent=g.title;
  const grid=document.getElementById('galleryGrid');
  grid.innerHTML='';
  for(let i=1;i<=g.max;i++){
    const img=document.createElement('img');
    img.src=`${g.folder}/${i}.jpg`; img.loading='lazy';
    img.onerror=()=>img.remove(); img.onclick=()=>window.open(img.src,'_blank');
    grid.appendChild(img);
    const vid=document.createElement('video');
    vid.src=`${g.folder}/${i}.mp4`; vid.controls=true; vid.preload='metadata';
    vid.onerror=()=>vid.remove(); grid.appendChild(vid);
  }
  document.getElementById('gallery').style.display='block';
  document.body.style.overflow='hidden';
}
function closeGallery(){
  document.getElementById('gallery').style.display='none';
  document.body.style.overflow='auto';
}
</script>
</body>
</html>
