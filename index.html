<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Ayyar Family Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 12px;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fbbf24;
        }
        .password-box {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            border-radius: 6px;
        }
        button {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background: #f59e0b;
        }
        .hidden {
            display: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .gallery-item {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }
        .gallery-img {
            width: 100%;
            height: 250px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .gallery-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-caption {
            padding: 15px;
            text-align: center;
        }
        .section-title {
            font-size: 2rem;
            margin: 40px 0 20px;
            color: #fbbf24;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="login" class="container">
        <div class="password-box">
            <h2>Al-Ayyar Family Archive</h2>
            <p>Enter password to view</p>
            <input type="password" id="password" placeholder="Password">
            <button onclick="checkPassword()">Enter</button>
            <p id="error" style="color: #ef4444; margin-top: 10px; display: none;">Wrong password</p>
        </div>
    </div>

    <div id="content" class="container hidden">
        <header>
            <h1>Al-Ayyar Family</h1>
            <p>Private Photo & Video Archive</p>
        </header>

        <h2 class="section-title">Photo Gallery</h2>
        <div class="gallery">
            <div class="gallery-item">
                <div class="gallery-img">
                    <img src="images/Mubarak-cover.jpg" alt="Mubarak Cover">
                </div>
                <div class="gallery-caption">Mubarak Cover</div>
            </div>
            
            <div class="gallery-item">
                <div class="gallery-img">Upload: family-photo-2.jpg</div>
                <div class="gallery-caption">Add caption here</div>
            </div>
            
            <div class="gallery-item">
                <div class="gallery-img">Upload: family-photo-3.jpg</div>
                <div class="gallery-caption">Add caption here</div>
            </div>
        </div>

        <h2 class="section-title">Videos</h2>
        <div class="gallery">
            <div class="gallery-item">
                <div class="gallery-img">Upload: family-video-1.mp4</div>
                <div class="gallery-caption">Add video caption</div>
            </div>
        </div>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('password').value;
            if (pass === 'alAyyar2024') {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
        
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
